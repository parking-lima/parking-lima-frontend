
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /api/v1/districts {
        proxy_pass http://parking-service:8000;
    }

    location ^~ /api/v1/users {
        proxy_pass http://users-service:8081;
    }

    location ^~ /api/v1/bookings {
        proxy_pass http://booking-service:3000;
    }

    location ^~ /api/v1/parkings {
        proxy_pass http://parking-service:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
